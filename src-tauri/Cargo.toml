[package]
name = "cronaut"
version = "0.1.0"
description = "A modern GUI for systemd timers and user cron on Linux"
authors = ["AlienResidents"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "cronaut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-store = "2.4.3"
tauri-plugin-os = "2.3.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-notification = "2.3.3"

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
chrono = { version = "0.4.45", features = ["serde"] }
cron = "0.16.0"
dirs = "6.0.0"
tokio = { version = "1.52.3", features = ["process", "io-util", "macros", "sync", "fs", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
